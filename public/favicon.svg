  <circle cx="32" cy="51" r="5" fill="none" stroke="#ff4d1f" stroke-width="1.5"/>

  <!-- Mid box -->
  <rect x="14" y="28" width="36" height="12" fill="#141413" stroke="#3a3a36" stroke-width="1"/>
  <circle cx="32" cy="34" r="3.5" fill="none" stroke="#ff4d1f" stroke-width="1"/>

  <!-- High horn -->
  <rect x="18" y="14" width="28" height="10" fill="#141413" stroke="#3a3a36" stroke-width="1"/>
  <circle cx="26" cy="19" r="2" fill="none" stroke="#ff4d1f" stroke-width="0.8"/>
  <circle cx="32" cy="19" r="2" fill="none" stroke="#ff4d1f" stroke-width="0.8"/>
  <circle cx="38" cy="19" r="2" fill="none" stroke="#ff4d1f" stroke-width="0.8"/>

